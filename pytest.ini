[pytest]
# Pytest configuration for FinRobot tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    --durations=10

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    ui: UI/Functional tests
    api: API endpoint tests
    slow: Slow running tests
    requires_api: Tests that require API keys
    requires_network: Tests that require network access

# Timeout (requires pytest-timeout)
timeout = 300
timeout_method = thread

# Coverage (when --cov is used)
[coverage:run]
source = finrobot
omit = 
    */tests/*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:

